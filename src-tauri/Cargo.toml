[package]
name = "rove"
version = "0.1.0"
description = "A focused two-pane file explorer"
authors = ["Rove"]
edition = "2021"

[lib]
name = "rove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "6"
trash = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
